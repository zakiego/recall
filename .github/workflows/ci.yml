name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or PR replaces the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The dashboard (apps/app): typecheck, tests and the SPA build; and the
  # Claude Code hooks.
  verify:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck the app
        working-directory: apps/app
        run: pnpm exec tsc --noEmit

      - name: Test the app
        working-directory: apps/app
        run: pnpm exec vitest run

      - name: Build the dashboard
        working-directory: apps/app
        run: pnpm exec vite build

      - name: Test the Claude Code hooks
        run: node --test integrations/claude-code/test/*.test.mjs

  # The Go server (apps/server). Every go command takes -tags sqlite_fts5.
  server:
    runs-on: ${{ fromJSON(vars.RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          # The same Go as the Dockerfile's builder image (go.mod only asks
          # for 1.26.0 or newer).
          go-version: "1.26.11"
          cache-dependency-path: apps/server/go.sum

      # The e5 embedding model (~120 MB) the tests load, fetched by the Go
      # downloader when missing, then restored. A model change in
      # download.go gets a new key.
      - uses: actions/cache@v4
        with:
          path: apps/app/data/models
          key: e5-model-go-${{ hashFiles('apps/server/internal/embed/download.go') }}
          restore-keys: e5-model-

      - name: Fetch the model and ONNX Runtime
        run: |
          go run -tags sqlite_fts5 ./tools/fetch-model ../app/data/models
          ./scripts/fetch-onnxruntime.sh  # this runner's os-arch

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Vet
        run: go vet -tags sqlite_fts5 ./...

      - name: Test
        run: go test -tags sqlite_fts5 ./...
