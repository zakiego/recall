version: 2
updates:
  # The Go server.
  - package-ecosystem: gomod
    directory: /apps/server
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
    open-pull-requests-limit: 5

  # The pnpm workspace (dashboard, site, edge worker).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
