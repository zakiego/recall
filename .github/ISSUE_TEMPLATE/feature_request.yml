name: Feature request
description: Suggest something Recall should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. API shape, MCP tool, or dashboard change.
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds you've tried
