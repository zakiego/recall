# zaki-selfhost compose file. deploy.sh builds and runs the `app` service.
name: recall

services:
  app:                        # keep this name, deploy.sh looks for it
    build: .
    image: recall:latest      # one tag, overwritten on every deploy; deploy.sh keeps recall:prev
    restart: unless-stopped
    # Idle was 1.3 GB before these existed. Both sit just above that peak, so a
    # regression gets the container restarted instead of eating the VM. Swap
    # equals the limit, so it can't grow into swap either. Lower them once the
    # "memory after ingest" log lines show the real numbers.
    mem_limit: 1536m
    memswap_limit: 1536m
    ports:
      - "127.0.0.1:4800:3000" # loopback only, the tunnel is the only way in
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # --max-old-space-size: V8 heap cap in MB; the default here was 2240.
      # The other two write a heap snapshot to /data on SIGUSR2, to see what
      # holds the heap without a restart:
      #   docker kill -s SIGUSR2 recall-app-1
      #   docker cp recall-app-1:/data/<Heap...heapsnapshot> .   then delete it from /data
      # The app freezes while it writes (seconds to a minute) and uses extra
      # memory for it, so do it when nothing is ingesting.
      NODE_OPTIONS: --max-old-space-size=512 --heapsnapshot-signal=SIGUSR2 --diagnostic-dir=/data
      # glibc gives each thread its own malloc arena and keeps freed memory in
      # all of them. Two arenas hold on to less after an embedding run.
      MALLOC_ARENA_MAX: "2"
      GATEWAY_URL: http://host.docker.internal:8793
      RECALL_URL: https://recall.zakiego.com   # origin only (the dashboard is at /app): cookies, passkey rpID, invite links
    volumes:
      - data:/data
    healthcheck:              # slim has no wget; deploy.sh waits on this
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 60s       # first boot downloads the embedding model (~120 MB)
      retries: 3
    logging:                  # caps logs at 30 MB per container
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
