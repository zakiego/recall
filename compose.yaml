# zaki-selfhost compose file. deploy.sh builds and runs the `app` service.
name: recall

services:
  app:                        # keep this name, deploy.sh looks for it
    build: .
    image: recall:latest      # one tag, overwritten on every deploy; deploy.sh keeps recall:prev
    restart: unless-stopped
    # The Go image measured 15 MiB idle and 190 to 230 MiB with the embedding
    # model loaded (docs/GO-PORT.md, M10a, and production after the cutover).
    # ONNX Runtime held up to 593 MB after a 144-passage run (measured on the
    # Node image, which used the same runtime). Under this limit the Go image
    # peaked at 297 MiB ingesting a 400-section document (2026-11-15), so it
    # leaves room for a big backfill while a leak still gets the container
    # restarted instead of eating the VM. Swap equals the limit, so it can't
    # grow into swap either.
    mem_limit: 768m
    memswap_limit: 768m
    ports:
      - "127.0.0.1:4800:3000" # loopback only, the tunnel is the only way in
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # ONNX Runtime (the embedding model) allocates through glibc.
      # glibc gives each thread its own malloc arena and keeps freed memory in
      # all of them. Two arenas hold on to less after an embedding run.
      MALLOC_ARENA_MAX: "2"
      # glibc raises its mmap threshold each time a big block is freed, so after
      # the first embedding run the model's tensors come from the arenas and
      # stay there. A fixed threshold keeps them on mmap, which goes back to the
      # OS on free. Measured in this image: 144 passages left rss at 771 MB
      # without it and 593 MB with it.
      GLIBC_TUNABLES: glibc.malloc.mmap_threshold=131072
      GATEWAY_URL: http://host.docker.internal:8793
      RECALL_URL: https://recall.zakiego.com   # origin only (the dashboard is at /app): cookies, passkey rpID, invite links
    volumes:
      - data:/data
    # The healthcheck lives in the Dockerfile: `recall healthcheck` (distroless
    # has no shell or wget), which deploy.sh's --wait waits on.
    logging:                  # caps logs at 30 MB per container
      driver: local
      options:
        max-size: 10m
        max-file: "3"

volumes:
  data:
